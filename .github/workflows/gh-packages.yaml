name: gh-package-deploy
on:
  push:
    tags:
      - "*"

permissions:
  contents: read   # for actions/checkout
  packages: write  # for pushing to GHCR (docker image + helm chart)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "${{ github.repository }}"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          # https://www.npmjs.com/package/semver#caret-ranges-123-025-004
          go-version: '^1.25'
      
      - name: Login to Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag
      
      - name: Build Packages
        run: |
          make build.linux.amd64 build.linux.arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: BASE_IMAGE=golang:1.25-alpine
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract chart version
        id: chart-version
        run: |
          # Strip leading 'v' from the git tag (e.g. v0.20.1 -> 0.20.1)
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        run: |
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: |
          helm package helm/kube-ingress-aws-controller \
            --version ${{ steps.chart-version.outputs.version }} \
            --app-version ${{ github.ref_name }}

      - name: Push Helm chart to GHCR
        run: |
          helm push kube-ingress-aws-controller-${{ steps.chart-version.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}
